name: CI

on:
  push:
    paths:
      - 'agent/**'
      - 'basquin-core/**'
      # DD-043: without these two, a change confined to the Quarkus extension or the Maven injector
      # triggers NO CI at all — their tests are part of `./gradlew check` but nothing would run it.
      # That is the defect PR-1 shipped when the extracted core fell outside every filter; PR #102
      # ran only because it incidentally also touched basquin-core/, settings.gradle and test/**.
      - 'basquin-quarkus/**'
      - 'basquin-maven-injector/**'
      - 'runner/**'
      - 'examples/**'
      - 'test/**'
      - 'native/**'
      - 'tomcat-war/**'
      - 'tomcat-valve/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      # DD-043 PR-3, round 8: `basquin-init.gradle` is the root-level init script whose hard-coded
      # default injected version verifyGradleInitScriptVersion (basquin-maven-injector/build.gradle)
      # exists to guard, and it was missing from both lists — a commit touching only this file ran
      # no CI at all, so that guard could drift undetected. Same gap class as basquin-quarkus/** above.
      - 'basquin-init.gradle'
      # Round 10: was 'deploy/bench/**' only, so the seven tracked citing *.sh files elsewhere under
      # deploy/ (deploy/helm/{publish,sync-generated}.sh, deploy/e2e/e2e.sh, deploy/k8s/up.sh, and the
      # three deploy/{agents,dashboard,runner}-image/build.sh — all scanned by check-citations.py's
      # tracked-*.sh comment rule) sat outside every filter: a commit touching only one of them ran no
      # CI at all, including the citation-integrity job that reads their '#'-comment citations.
      # Broadened to the whole subtree so a future deploy/*.sh addition can't silently reopen this.
      - 'deploy/**'
      # Round 10: this PR modified .gitignore and it matched no filter — the one gap left in this
      # list's own class (basquin-quarkus/**, basquin-init.gradle before it). Any tracked top-level
      # path should trigger at least one CI job; this was the last one that didn't.
      - '.gitignore'
      # DD-045 item 1: the citation-integrity job checks every tracked *.md, */citations.txt and
      # the '#'-comments of scripts/*.sh and workflow files, resolving citations against the
      # files they cite (mostly under bench-results/). All of those classes must trigger CI, or
      # the guard cannot see the very edits that stale citations — a doc-only push previously
      # ran NO CI at all, which is how 135 wrong citations accumulated (see
      # bench-results/dd043-pr3-citation-audit-2026-07-30/). Deliberate trade-off: the Gradle
      # jobs now also run on doc-only pushes; correctness of the certification machinery was
      # judged worth the CI minutes (DD-045's whole thesis).
      - '**/*.md'
      - '**/citations.txt'
      - 'scripts/**'
      - 'bench-results/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'agent/**'
      - 'basquin-core/**'
      # See the push block above — both lists must carry these or the gap persists on one trigger.
      - 'basquin-quarkus/**'
      - 'basquin-maven-injector/**'
      - 'runner/**'
      - 'examples/**'
      - 'test/**'
      - 'native/**'
      - 'tomcat-war/**'
      - 'tomcat-valve/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'basquin-init.gradle'
      - 'deploy/**'
      - '.gitignore'
      # See the push block above — both lists must carry these or the citation gap persists on
      # one trigger (same dual-list rule as basquin-quarkus/** etc.).
      - '**/*.md'
      - '**/citations.txt'
      - 'scripts/**'
      - 'bench-results/**'
      - '.github/workflows/**'

jobs:
  # DD-045 item 1 — whole-tree citation integrity. A repo-wide audit found 135 of 547 citations
  # wrong (1 in 4), and wrong citations were review findings in five consecutive PR #103 rounds.
  # The check is whole-tree, not diff-scoped: a diff-scoped run missed four dead citations that
  # sat in files the commit did not touch. Pure Python stdlib, no JDK, finishes in ~1s; its
  # scope and conscious exclusions are documented in the script's docstring, and every exemption
  # in scripts/check-citations-allowlist.txt carries a reason.
  citation-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check citations resolve against cited file content
        run: python3 scripts/check-citations.py


  # DD-045 item 0 — the DD-043 PR-3 verification harness had never run anywhere but a developer's
  # shell, so several of its own assertions (jar:baked-version on a CRLF checkout, the jar stage
  # grading a stale build because the compile's exit code was discarded, jvm:zero-edits passing on
  # a directory it never examined) stayed broken for multiple approver rounds before anyone
  # noticed. Wiring it in here turns that class of defect into a push-time failure.
  #
  # Scope: only `unit jar guards` — deliberately NOT `jvm` or `native`. Those two need docker and
  # take 15+ minutes (native alone is a serialized ~15-minute compile); they stay manual-only, run
  # by hand per the script's own header. `unit jar guards` need no docker and are what would have
  # caught the findings above.
  verify-dd043-pr3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify DD-043 PR-3 harness (unit jar guards)
        run: bash scripts/verify-dd043-pr3.sh unit jar guards
      - name: Upload verification run directory
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-dd043-pr3-results
          path: bench-results/verify-*/
          if-no-files-found: warn

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    name: build-and-test (JDK ${{ matrix.java }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # Pure-Python, no JDK needed, so these run before the Gradle steps. Four consecutive review
      # rounds on a prior PR blocked on a hand-written benchmark number, and one misquote survived
      # all four; check_claims.py fails if a coverage figure in prose disagrees with
      # bench-results/campaigns.json. test_redact.py pins that credential redaction never touches a
      # ${{ }} corpus recipe. A guard that only runs when someone remembers it will drift.
      - name: Bench artifact drift guards
        run: |
          python3 deploy/bench/check_claims.py
          python3 deploy/bench/test_redact.py
      - name: Gradle build
        uses: gradle/gradle-build-action@v3
      - name: Build
        run: ./gradlew build --no-daemon --warning-mode all
      - name: Test
        run: ./gradlew test --no-daemon --warning-mode all
      - name: Check (verifications)
        run: ./gradlew check --no-daemon --warning-mode all
      - name: Build valve module
        run: ./gradlew :tomcat-valve:jar --no-daemon --warning-mode all

  native-agent:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle build
        uses: gradle/gradle-build-action@v3
      - name: Build native agent (gcc + JDK headers)
        run: ./gradlew buildNativeAgent --no-daemon --warning-mode all
      - name: Smoke test — agent loads and tracks thread lifecycle
        shell: bash
        run: |
          set -e
          LIB="$(pwd)/build/native/libbasquinjvmti.so"
          test -f "$LIB" || { echo "native lib not built" >&2; exit 1; }
          ./gradlew jar --no-daemon --warning-mode all
          # Run a short proper-mode loop with the agent injected; must complete cleanly.
          java -agentpath:"$LIB" -Dbasquin.native.lib="$LIB" \
            -Dbasquin.target=examples.targets.ThreadLeakTarget \
            -Dexamples.mode=proper -Dexamples.sleepMs=1 -Dexamples.threads=2 \
            -cp build/libs/basquin-0.3.0.jar runner.GenericRunner 20 examples.targets.ThreadLeakTarget

  leak-demo:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle build
        uses: gradle/gradle-build-action@v3
      - name: Leak demo should fail (expected)
        shell: bash
        run: |
          set +e
          ./gradlew runRunnerLeak --no-daemon --warning-mode all
          status=$?
          echo "Leak demo exit status: $status"
          if [ $status -eq 0 ]; then
            echo "ERROR: Leak demo unexpectedly succeeded" >&2
            exit 1
          fi
          echo "Leak demo failed as expected"
