# Single shared source of truth for the JaCoCo version used across this multi-project build.
# Consumed by:
#   - root build.gradle: the `coverage`/`test` source sets' `org.jacoco:org.jacoco.core` dependency,
#     and the `jacocoAgent` configuration (the standalone -javaagent jar staged for the Tomcat path).
#   - basquin-maven-injector/build.gradle: generates the `JacocoVersion` Java constant Task 2's
#     injected `jacoco-maven-plugin:instrument` execution will pin to (see JacocoVersion.java).
#
# Properties set here are visible to every project in this build (Gradle inherits the root
# project's gradle.properties into all subprojects), so both consumers read the SAME value with no
# hand-typed second copy.
#
# 0.8.12 -> 0.8.15: 0.8.12's ASM cannot parse the targets' Java-25 (major-69) classfiles, and
# Analyzer#analyzeClass swallows the resulting exception rather than propagating it, which silently
# zeroes the coverage denominator instead of failing loudly (DD-043 PR-4, decision D1).
jacocoVersion=0.8.15
