name: Release

# Cut a release by pushing a version tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# (or run manually via the Actions tab with a version input). Publishes:
#   - the four container images to GitHub Container Registry (ghcr.io/ianp94/basquin-*)
#   - the basquin CLI binaries (linux/darwin, amd64/arm64) as release assets
#   - the packaged Helm chart as a release asset
#   - the GitHub Pages Helm repo (docs/charts/) — the `pages` job repackages + reindexes + commits to
#     main automatically (deploy/helm/publish.sh remains for a manual/bootstrap refresh).
#   - the GitHub Pages Maven repo (docs/maven/) — the same `pages` job publishes the whole Basquin
#     extension chain there (basquin-core, basquin-quarkus, basquin-quarkus-deployment) and commits
#     it, so a Maven build can depend on them with no credentials.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.2.0)'
        required: true

permissions:
  contents: write   # create the release + upload assets
  packages: write   # push images to ghcr

env:
  REGISTRY: ghcr.io
  OWNER: ianp94

jobs:
  images:
    name: Build + push container images (ghcr, multi-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
      - name: Set up QEMU (arm64 emulation for the multi-arch build)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve version
        id: v
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" | sed 's/tag=v/tag=/' >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Stage the jars + native source into each image's build context (STAGE_ONLY skips the local
      # single-arch docker build); operator needs no staging (self-contained Dockerfile).
      - name: Stage image build contexts
        run: |
          set -e
          T='${{ steps.v.outputs.tag }}'
          STAGE_ONLY=1 bash deploy/agents-image/build.sh    "$T"
          STAGE_ONLY=1 bash deploy/runner-image/build.sh    "$T"
          STAGE_ONLY=1 bash deploy/dashboard-image/build.sh "$T"
      # One buildx invocation per image builds BOTH arches and pushes a manifest list (DD-027). The
      # agents image compiles its native .so per-arch inside the Dockerfile (native on amd64, QEMU on
      # arm64); the others are arch-independent artifacts on multi-arch bases.
      - name: Build + push multi-arch images (linux/amd64,linux/arm64)
        run: |
          set -e
          T='${{ steps.v.outputs.tag }}'
          PLATFORMS=linux/amd64,linux/arm64
          for pair in "operator:operator" "agents:deploy/agents-image" \
                      "runner:deploy/runner-image" "dashboard:deploy/dashboard-image"; do
            img="${pair%%:*}"; ctx="${pair#*:}"
            dst="$REGISTRY/$OWNER/basquin-$img"
            echo "==> buildx $dst ($PLATFORMS) from $ctx"
            docker buildx build --platform "$PLATFORMS" \
              -t "$dst:$T" -t "$dst:latest" \
              --push "$ctx"
          done

  cli:
    name: Build + upload CLI binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      # Pure-Go (CGO_ENABLED=0), so cross-compiling every target is native and instant — no QEMU or
      # buildx needed here, unlike the images (whose native .so forced the per-arch build, DD-027).
      # -X main.version stamps the tag so `basquin version` identifies a downloaded binary.
      - name: Cross-compile the basquin CLI
        working-directory: operator
        run: |
          set -e
          T='${{ github.event.inputs.version || github.ref_name }}'; T="${T#v}"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${pair%/*}"; arch="${pair#*/}"
            # Note: `[ x = y ] && ext=...` would abort the step under `set -e` when the test fails.
            if [ "$os" = "windows" ]; then ext=".exe"; else ext=""; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -X main.version=$T" \
                -o "dist/basquin-$os-$arch$ext" ./cmd/basquin
          done
          (cd dist && sha256sum basquin-* > checksums.txt)
          ls -la dist/
      - name: Upload CLI assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: |
            operator/dist/basquin-*
            operator/dist/checksums.txt

  chart:
    name: Package + upload Helm chart
    needs: [cli]   # serialize the two action-gh-release calls (avoid a create race on the same tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Resolve version
        id: v
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" | sed 's/tag=v/tag=/' >> "$GITHUB_OUTPUT"
      - name: Package the chart at the release version (--app-version drives all image tags)
        run: |
          mkdir -p dist
          helm package deploy/helm/basquin-operator --destination dist \
            --version "${{ steps.v.outputs.tag }}" --app-version "${{ steps.v.outputs.tag }}"
      - name: Upload chart asset to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          files: dist/*.tgz

  pages:
    name: Publish chart to the GitHub Pages Helm repo
    # Only advertise a chart version once its images actually shipped + the chart asset is on the
    # release — otherwise the Pages repo would offer a version whose ghcr images don't exist.
    # NOTE: assumes the tag is the tip of main (this job re-packages from main, not the tagged commit).
    needs: [images, chart]
    runs-on: ubuntu-latest
    steps:
      # Mint a basquin-bot installation token: its push to protected main bypasses the branch ruleset
      # (the bot is a protect-main bypass actor — the generic GITHUB_TOKEN/Actions app cannot be, on a
      # personal repo, which is why the direct push failed for v0.2.0). See docs/BOT-SETUP.md.
      - name: Mint basquin-bot token
        id: bot
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      # Check out main (a tag build is detached HEAD) so we can commit the packaged chart + index back.
      # Use the bot token so the push below is attributed to the bypass-actor bot, not GITHUB_TOKEN.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
      - uses: azure/setup-helm@v4
      - name: Resolve version
        id: v
        run: echo "tag=${{ github.event.inputs.version || github.ref_name }}" | sed 's/tag=v/tag=/' >> "$GITHUB_OUTPUT"
      - name: Package into docs/charts + regenerate the repo index
        run: |
          helm package deploy/helm/basquin-operator --destination docs/charts \
            --version "${{ steps.v.outputs.tag }}" --app-version "${{ steps.v.outputs.tag }}"
          helm repo index docs/charts --url https://ianp94.github.io/basquin/charts --merge docs/charts/index.yaml
      # DD-043: publish the extension chain into docs/maven, which Pages serves at
      # https://ianp94.github.io/basquin/maven/ — the Maven-repo counterpart of docs/charts.
      # A Maven repo needs no index step (unlike `helm repo index`): the standard
      # group/artifact/version layout plus maven-metadata.xml, which Gradle writes, is the whole
      # contract. Publishing is additive, so prior versions stay resolvable.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # DD-043 made `version` load-bearing in every published module's build.gradle (basquin-core
      # and both basquin-quarkus modules). It was decorative before —
      # nothing in the build read it, and the workflow stamps images/CLI/chart straight from the tag —
      # so a release-prep commit that bumps the tag but forgets this field is a very plausible miss.
      # The failure would be silent: Gradle would republish the OLD coordinate, `git diff --cached`
      # would still see changed checksums and commit, and nobody would notice until a consumer 404s
      # on the new version. Assert instead of overriding with -Pversion: the repo's convention is that
      # the release commit bumps the file, and a guard enforces that convention where an override
      # would hide its violation.
      - name: Assert every published module's version matches the release tag
        run: |
          set -euo pipefail
          TAG='${{ steps.v.outputs.tag }}'
          fail=0
          for p in :basquin-core :basquin-quarkus:runtime :basquin-quarkus:deployment; do
            V="$(./gradlew -q "$p:properties" --no-daemon | awk -F': ' '/^version:/{print $2}')"
            echo "$p version=$V  release tag=$TAG"
            if [ "$V" != "$TAG" ]; then
              echo "::error::$p has version '$V' but this release is '$TAG'. Bump it in the release" \
                   "commit, or the Pages Maven repo will advertise the wrong coordinate."
              fail=1
            fi
          done
          [ "$fail" -eq 0 ]
      # DD-043 PR-3: the injector resolves the whole extension chain from this repo, so all three
      # artifacts ship together. Publishing only basquin-core would leave an injected build failing
      # to resolve basquin-quarkus — loudly, but only at a user's build rather than here.
      - name: Publish the extension chain into the Pages Maven repo
        run: |
          ./gradlew --no-daemon \
            :basquin-core:publishAllPublicationsToPagesRepository \
            :basquin-quarkus:runtime:publishAllPublicationsToPagesRepository \
            :basquin-quarkus:deployment:publishAllPublicationsToPagesRepository
      - name: Assert the extension chain reached docs/maven
        run: |
          set -euo pipefail
          TAG='${{ steps.v.outputs.tag }}'
          for a in basquin-core basquin-quarkus basquin-quarkus-deployment; do
            f="docs/maven/com/basquin/$a/$TAG/$a-$TAG.jar"
            [ -f "$f" ] || { echo "::error::$f missing after publish"; exit 1; }
          done
          echo "extension chain present in docs/maven"
      - name: Commit the updated Helm + Maven repos to main
        run: |
          git config user.name  "basquin-bot[bot]"
          git config user.email "307641014+basquin-bot[bot]@users.noreply.github.com"
          git add docs/charts docs/maven
          if git diff --cached --quiet; then
            echo "no chart or maven changes to publish"; exit 0
          fi
          git commit -m "chore(release): publish chart + the Basquin extension chain ${{ steps.v.outputs.tag }} to the Pages repos [skip ci]"
          git push origin main
